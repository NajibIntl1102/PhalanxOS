# Optional PhalanxOS security tools manifest
# These tools are for authorized security testing, education, and defensive validation only.
profile: optional-security-tools
base: debian-live-build
install_by_default: false
policy: docs/security-tools-policy.md
install_profiles:
  default_desktop:
    install_by_default: true
    description: Everyday defensive and privacy-safe desktop tools only.
  privacy:
    install_by_default: false
    description: Opt-in privacy and anonymity workflows with operational-safety notes.
  security_auditor:
    install_by_default: false
    description: Opt-in tools for authorized administration, diagnostics, and defensive validation.
  advanced_pentesting:
    install_by_default: false
    requires_high_risk_gate: true
    description: Opt-in dual-use tools for authorized labs, ranges, and engagements.
high_risk_gate:
  required_for:
    - metasploit-framework
    - burpsuite
    - hashcat
    - aircrack-ng
    - hydra
  warning: >
    These advanced dual-use tools must be used only for defensive auditing,
    privacy research, training labs, or systems where the user has explicit
    authorization. Unauthorized scanning, exploitation, password attacks,
    wireless attacks, traffic interception, or credential testing may be
    illegal and harmful.
packages:
  - name: nmap
    component: Nmap
    install_profile: security_auditor
    source: debian
    license: Nmap Public Source License / GPL-derived terms; verify Debian copyright metadata
    redistribution_status: candidate for optional auditor image from Debian repositories
    default_installation_status: not installed by default
    high_risk_gate_required: false
    legal_ethical_note: Scan only networks, hosts, and services the user owns or is explicitly authorized to test.
  - name: metasploit-framework
    component: Metasploit Framework
    install_profile: advanced_pentesting
    source: external-or-kali
    license: BSD-style components plus Rapid7 packaging terms; requires version-specific review
    redistribution_status: not redistributable in default ISO until license, update, and provenance review is complete
    default_installation_status: not installed by default
    high_risk_gate_required: true
    legal_ethical_note: Use only in owned labs, ranges, or client-authorized engagements; do not document unauthorized exploitation playbooks.
  - name: burpsuite
    component: Burp Suite
    install_profile: advanced_pentesting
    source: debian-nonfree-or-vendor
    license: proprietary edition-specific terms; Community and Professional require separate review
    redistribution_status: not redistributable in default ISO without edition-specific terms review
    default_installation_status: not installed by default
    high_risk_gate_required: true
    legal_ethical_note: Use only for authorized web application testing; do not intercept third-party traffic without consent.
  - name: john
    component: John the Ripper
    install_profile: security_auditor
    source: debian
    license: GPL; verify Debian copyright metadata
    redistribution_status: candidate for optional auditor image from Debian repositories
    default_installation_status: not installed by default
    high_risk_gate_required: false
    legal_ethical_note: Use for offline password auditing of owned password hashes or approved training data only.
  - name: hashcat
    component: Hashcat
    install_profile: advanced_pentesting
    source: debian
    license: MIT; verify Debian copyright metadata and driver licenses
    redistribution_status: conditional; core package may be redistributable from Debian, but GPU stacks require separate review
    default_installation_status: not installed by default
    high_risk_gate_required: true
    legal_ethical_note: Use only for password recovery or auditing with explicit authorization; never target third-party credentials.
  - name: aircrack-ng
    component: Aircrack-ng
    install_profile: advanced_pentesting
    source: debian
    license: GPL; verify Debian copyright metadata
    redistribution_status: candidate for optional advanced profile from Debian repositories after policy review
    default_installation_status: not installed by default
    high_risk_gate_required: true
    legal_ethical_note: Test only owned lab wireless networks or client-authorized environments; comply with radio, privacy, and wiretap laws.
  - name: hydra
    component: Hydra
    install_profile: advanced_pentesting
    source: debian
    license: AGPL/GPL-family; verify Debian copyright metadata
    redistribution_status: candidate for optional advanced profile from Debian repositories after policy review
    default_installation_status: not installed by default
    high_risk_gate_required: true
    legal_ethical_note: Use only for authorized login control validation; do not run password attacks against public or third-party services.
licensing_notes:
  - This manifest is optional and must not be installed by default in the first desktop ISO.
  - Metasploit Framework and Burp Suite require additional redistribution and edition-specific license review.
  - Tools from Debian non-free, vendor downloads, or third-party repositories require explicit provenance records.
  - Some tools may be subject to local law, export rules, workplace policies, or service terms.
